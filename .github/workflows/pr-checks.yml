name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The action lists the PR's commits through the API, which needs this.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.actor != 'dependabot[bot]'
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        if: github.actor != 'dependabot[bot]'
        with:
          # .cjs, because the action's runtime treats bare .js as ESM and the
          # config uses module.exports.
          configFile: commitlint.config.cjs

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dev tools
        run: uv sync --locked --no-build

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format
        if: success() || failure()
        run: uv run --no-sync ruff format --check .

      - name: Type-check
        if: success() || failure()
        run: uv run --no-sync ty check

      - name: ShellCheck
        if: success() || failure()
        run: shellcheck hooks/hud-event.sh install.sh swiftbar/hud.30s.sh tests/hook-smoke.sh

      - name: Hook smoke test
        if: success() || failure()
        run: tests/hook-smoke.sh
