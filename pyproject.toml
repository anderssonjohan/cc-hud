[project]
name = "cc-hud"
version = "0.0.0"
description = "A session board for Claude Code sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "ty==0.0.85",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLW"]
